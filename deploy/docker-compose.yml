# One VM, one origin: caddy → web (Next.js) + api (swarn-backend); postgres,
# minio; the API launches sandbox containers through the Docker socket.
#
# Layout: <root>/agent2, <root>/swarn-backend, <root>/swarn-frontend
# Usage (from this folder):
#   cp ../.env.example ../.env   # fill BACKEND_* and SWARN_* values
#   cp .env.example .env         # SITE_ADDRESS, POSTGRES_PASSWORD, MINIO_ROOT_*
#   docker compose up -d --build

name: swarn

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, api]

  web:
    build:
      context: ../../swarn-frontend
      args:
        NEXT_PUBLIC_SWARN_API: "/"
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: swarn-backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      BACKEND_DATABASE_URL: postgresql+asyncpg://swarn:${POSTGRES_PASSWORD}@postgres:5432/swarn_backend
      BACKEND_S3_ENDPOINT: http://minio:9000
      BACKEND_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      BACKEND_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKEND_WORK_DIR: /var/lib/swarn/work
      BACKEND_INSECURE_COOKIES: "0"
      SWARN_SANDBOX: docker
    volumes:
      # the sandbox bind-mounts job directories, so the host path must match
      - /var/lib/swarn/work:/var/lib/swarn/work
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swarn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: swarn_backend
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarn -d swarn_backend"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]

volumes:
  pgdata:
  minio-data:
  caddy-data:
